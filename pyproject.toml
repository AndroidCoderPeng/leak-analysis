[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leak-analysis"
version = "0.2.0"
description = "漏水信号分析与相关定位命令行工具"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.scripts]
leak-analysis = "cli:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["cli", "report", "main"]
